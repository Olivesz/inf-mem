name: Live model

# Real Groq calls, so it runs nightly and on demand rather than on every push.
# It fails, never skips, when the GROQ_API_KEY secret is missing.
on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      FASTEMBED_CACHE_PATH: /home/runner/.cache/fastembed
    steps:
      - name: Require the Groq secret
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "::error::GROQ_API_KEY is not set in this repository's Actions secrets."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - uses: actions/cache@v4
        with:
          path: /home/runner/.cache/fastembed
          key: fastembed-bge-small-en-v1.5
      - uses: actions/cache@v4
        with:
          path: eval/data
          key: locomo-79fa87e90f04

      - name: Extraction on 20 fixed LoCoMo turns
        run: python eval/live_extract.py

      - name: Merge judge on the labelled pairs
        run: python eval/dedupe_judge.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-results
          path: |
            eval/results/live-extract.json
            eval/results/dedupe-judge.json
            eval/cache/dedupe-judge.jsonl
